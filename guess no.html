<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Number</title>
    <link rel="stylesheet" href="guess no.css">
</head>
<body>
    <div>
        <h1>🎯 Guess the Number</h1>
        <p id="para">
            I have selected a number between 1 and 10
        </p>
        <div>
            <p id="para1">Enter your guess:</p>
            <input type="number" id="inputnumb" placeholder="Enter a number (1-10)">
            <button id="checkbtn">Check Guess </button>
        </div>
        <div>
            <p id="para2">💡 How to play:</p>
            <p id="para3">
                Guess the number in as few attempts as possible.
            </p>
        </div>
        <div>
            <p id="attempts">Attempts: 0</p>
            <p id="score">🏆 High Score: --</p></div>
        <h2 id="result"></h2>
        <button id="resetbtn">🔄 Reset Game</button>
    </div>
    <script src="guess no.js"></script>
</body>
</html>
